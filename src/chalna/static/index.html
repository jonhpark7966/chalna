<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찰나 (Chalna) — SRT 자막 생성</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #0f3460;
  --accent-bright: #1a5276;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --success: #27ae60;
  --error: #e74c3c;
  --warning: #f39c12;
  --border: #2a3a5e;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  font-size: 1.25rem;
  font-weight: 600;
}

header h1 span { color: var(--text-dim); font-weight: 400; font-size: 0.9rem; }

header a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.85rem;
}
header a:hover { color: var(--text); }

.container {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 20px;
  max-width: 1200px;
  margin: 24px auto;
  padding: 0 24px;
}

@media (max-width: 768px) {
  .container { grid-template-columns: 1fr; }
}

/* --- Left Panel --- */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.panel h2 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 16px;
}

.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--accent-bright);
  background: rgba(15, 52, 96, 0.2);
}

.drop-zone.has-file {
  border-color: var(--success);
  border-style: solid;
}

.drop-zone p { color: var(--text-dim); font-size: 0.9rem; }
.drop-zone .file-name { color: var(--text); font-weight: 500; margin-top: 4px; }
.drop-zone .file-size { color: var(--text-dim); font-size: 0.8rem; }
.drop-zone input { display: none; }

/* Form fields */
label.field {
  display: block;
  margin-bottom: 14px;
}

label.field .label-text {
  display: block;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 4px;
}

textarea, input[type="text"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.9rem;
  font-family: inherit;
  resize: vertical;
}

textarea:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--accent-bright);
}

.checkbox-group { margin-bottom: 16px; }

.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  margin-bottom: 6px;
}

.checkbox-group input[type="checkbox"] {
  accent-color: var(--accent-bright);
  width: 16px;
  height: 16px;
}

button.submit {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: 1px solid var(--accent-bright);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

button.submit:hover:not(:disabled) { background: var(--accent-bright); }
button.submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* --- Right Panel --- */
.status-idle { color: var(--text-dim); text-align: center; padding: 48px 16px; font-size: 0.95rem; }

/* Progress */
.progress-section { margin-bottom: 20px; }
.progress-section .stage { font-size: 1rem; font-weight: 500; margin-bottom: 8px; }
.progress-section .meta { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }

.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #0f3460, #1a5276);
  border-radius: 4px;
  transition: width 0.5s ease;
  width: 0%;
}

/* Result */
.result-section h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.result-badge {
  display: inline-block;
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 8px;
  font-weight: 500;
}

.badge-refined { background: var(--success); color: #fff; }
.badge-unrefined { background: var(--warning); color: #1a1a2e; }

.srt-output {
  width: 100%;
  min-height: 240px;
  max-height: 480px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 0.85rem;
  padding: 12px;
  resize: vertical;
  line-height: 1.6;
}

button.download {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 20px;
  background: var(--success);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
}

button.download:hover { opacity: 0.9; }

/* Intermediate collapsible */
details {
  margin-top: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

details summary {
  padding: 10px 14px;
  background: var(--accent);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  user-select: none;
}

details summary:hover { background: var(--accent-bright); }

.intermediate-content {
  padding: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.intermediate-content button {
  padding: 6px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
}

.intermediate-content button:hover { background: var(--accent); }

/* Error */
.error-box {
  background: rgba(231, 76, 60, 0.1);
  border: 1px solid var(--error);
  border-radius: var(--radius);
  padding: 16px;
  color: var(--error);
}

.error-box .error-title { font-weight: 600; margin-bottom: 4px; }
.error-box .error-msg { font-size: 0.9rem; }

/* --- History Panel --- */
.history-panel {
  max-width: 1200px;
  margin: 0 auto 24px;
  padding: 0 24px;
}

.history-panel .panel { padding: 16px 20px; }

.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.history-header h2 { margin-bottom: 0; }

.history-header .total-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.history-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 500;
  font-size: 0.8rem;
  white-space: nowrap;
}

.history-table td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(42, 58, 94, 0.4);
  vertical-align: middle;
}

.history-table tr { cursor: pointer; transition: background 0.15s; }
.history-table tbody tr:hover { background: rgba(15, 52, 96, 0.3); }
.history-table tr.selected { background: rgba(15, 52, 96, 0.5); }

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

.status-dot.completed { background: var(--success); }
.status-dot.failed { background: var(--error); }

.badge-sm {
  display: inline-block;
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 500;
}

.badge-sm.refined { background: var(--success); color: #fff; }
.badge-sm.unrefined { background: var(--warning); color: #1a1a2e; }
.badge-sm.no-files { background: rgba(255,255,255,0.1); color: var(--text-dim); }

.history-empty {
  text-align: center;
  padding: 24px;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.history-pager {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

.history-pager button {
  padding: 4px 14px;
  background: var(--accent);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.8rem;
  cursor: pointer;
}

.history-pager button:disabled { opacity: 0.3; cursor: not-allowed; }
.history-pager button:hover:not(:disabled) { background: var(--accent-bright); }

/* Pipeline Stepper */
.progress-header { margin-bottom: 20px; }
.progress-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.progress-title span:first-child { font-size: 1rem; font-weight: 500; }
.progress-pct { font-size: 1.2rem; font-weight: 700; color: var(--accent-bright); }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; }

.pipeline-stepper { margin: 16px 0; }

.step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  position: relative;
}

/* Connecting line */
.step:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 13px;
  top: 36px;
  bottom: -10px;
  width: 2px;
  background: var(--border);
}

.step.done:not(:last-child)::after { background: var(--success); }
.step.active:not(:last-child)::after { background: linear-gradient(to bottom, var(--success), var(--border)); }

.step-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
  border: 2px solid var(--border);
  color: var(--text-dim);
  background: var(--bg);
  z-index: 1;
}

.step.done .step-icon {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.step.active .step-icon {
  border-color: var(--accent-bright);
  color: var(--accent-bright);
  animation: pulse-ring 1.5s ease-in-out infinite;
}

@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(26, 82, 118, 0.4); }
  50% { box-shadow: 0 0 0 6px rgba(26, 82, 118, 0); }
}

.step-content { flex: 1; min-width: 0; }
.step-name { font-size: 0.9rem; font-weight: 500; }
.step.pending .step-name { color: var(--text-dim); }
.step.active .step-name { color: var(--text); }
.step.done .step-name { color: var(--success); }

.step-detail { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }

.step-mini-bar {
  width: 100%;
  height: 3px;
  background: var(--bg);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.step-mini-fill {
  height: 100%;
  background: var(--accent-bright);
  border-radius: 2px;
  transition: width 0.5s ease;
}

.step-intermediate-btn {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 10px;
  font-size: 0.75rem;
  background: rgba(15, 52, 96, 0.5);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
}
.step-intermediate-btn:hover { background: var(--accent); }

/* SRT Preview Modal */
.srt-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.srt-modal-overlay.show { display: flex; }

.srt-modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 90%;
  max-width: 700px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}

.srt-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.srt-modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.2rem;
  cursor: pointer;
}

.srt-modal-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}

.srt-modal-body textarea {
  width: 100%;
  min-height: 300px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 0.82rem;
  padding: 12px;
  resize: vertical;
  line-height: 1.5;
}

.live-intermediate { margin-top: 16px; }
.live-intermediate h4 { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
.intermediate-btns { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <h1>찰나 (Chalna) <span>— SRT 자막 생성</span></h1>
  <a href="/docs">API Docs</a>
</header>

<div class="container">
  <!-- Left: Input Panel -->
  <div class="panel" id="input-panel">
    <h2>입력</h2>

    <div class="drop-zone" id="drop-zone">
      <p>파일을 드래그하거나 클릭하여 업로드</p>
      <p style="font-size:0.8rem; margin-top:4px; color:var(--text-dim)">mp3, wav, m4a, flac, ogg, mp4, mov, webm, mkv, avi</p>
      <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.flac,.ogg,.mp4,.mov,.webm,.mkv,.avi">
    </div>

    <label class="field">
      <span class="label-text">컨텍스트 (선택)</span>
      <textarea id="context-input" rows="2" placeholder="예: 참석자: 철수, 영희"></textarea>
    </label>

    <div class="checkbox-group">
      <label><input type="checkbox" id="opt-alignment" checked> 타임스탬프 정렬</label>
      <label><input type="checkbox" id="opt-refinement" checked> LLM 자막 교정</label>
    </div>

    <button class="submit" id="btn-submit" disabled>변환</button>
  </div>

  <!-- Right: Status / Result Panel -->
  <div class="panel" id="result-panel">
    <div id="view-idle" class="status-idle">
      파일을 업로드하고 변환을 시작하세요.
    </div>

    <div id="view-progress" style="display:none">
      <!-- Overall progress header -->
      <div class="progress-header">
        <div class="progress-title">
          <span id="progress-overall-text">처리 중...</span>
          <span class="progress-pct" id="progress-pct-text">0%</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
        <div class="progress-meta">
          <span id="progress-elapsed">경과: 0초</span>
          <span id="progress-eta-text"></span>
        </div>
      </div>

      <!-- Pipeline Stepper -->
      <div class="pipeline-stepper" id="pipeline-stepper">
        <!-- Steps will be generated by JS -->
      </div>

      <!-- Intermediate Results (shown as they become available) -->
      <div class="live-intermediate" id="live-intermediate" style="display:none">
        <h4>중간 결과물</h4>
        <div class="intermediate-btns" id="live-intermediate-btns"></div>
      </div>
    </div>

    <div id="view-result" style="display:none">
      <div class="result-section">
        <h3>결과 <span id="result-badge"></span></h3>
        <div class="meta" id="result-duration" style="margin-bottom:10px"></div>
        <textarea class="srt-output" id="srt-output" readonly></textarea>
        <br>
        <button class="download" id="btn-download">SRT 다운로드</button>
      </div>

      <details id="intermediate-section" style="display:none">
        <summary>중간 결과물</summary>
        <div class="intermediate-content" id="intermediate-buttons"></div>
      </details>
    </div>

    <div id="view-error" style="display:none">
      <div class="error-box">
        <div class="error-title" id="error-title">오류</div>
        <div class="error-msg" id="error-msg"></div>
      </div>
    </div>
  </div>
</div>

<!-- History Panel -->
<div class="history-panel">
  <div class="panel">
    <div class="history-header">
      <h2>히스토리</h2>
      <span class="total-count" id="history-count"></span>
    </div>
    <table class="history-table" id="history-table">
      <thead>
        <tr>
          <th>상태</th>
          <th>일시</th>
          <th>길이</th>
          <th>교정</th>
          <th>파일</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <div class="history-empty" id="history-empty" style="display:none">기록이 없습니다.</div>
    <div class="history-pager" id="history-pager" style="display:none">
      <button id="history-prev" disabled>이전</button>
      <button id="history-next" disabled>다음</button>
    </div>
  </div>
</div>

<div class="srt-modal-overlay" id="srt-modal">
  <div class="srt-modal">
    <div class="srt-modal-header">
      <span id="srt-modal-title">중간 결과</span>
      <button class="srt-modal-close" onclick="closeSrtModal()">&times;</button>
    </div>
    <div class="srt-modal-body">
      <textarea id="srt-modal-content" readonly></textarea>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- Pipeline stages ---
  // Order must match actual pipeline execution order
  const PIPELINE_STAGES = [
    { key: 'validating', name: '오디오 검증' },
    { key: 'transcribing', name: '자막 생성 (VibeVoice ASR)' },
    { key: 'loading_models', name: '정렬 모델 로딩' },
    { key: 'aligning', name: '타임스탬프 정렬 (Qwen)' },
    { key: 'refining', name: '자막 교정 (LLM)' },
  ];

  // --- DOM refs ---
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const contextInput = document.getElementById('context-input');
  const optAlignment = document.getElementById('opt-alignment');
  const optRefinement = document.getElementById('opt-refinement');
  const btnSubmit = document.getElementById('btn-submit');

  const viewIdle = document.getElementById('view-idle');
  const viewProgress = document.getElementById('view-progress');
  const viewResult = document.getElementById('view-result');
  const viewError = document.getElementById('view-error');

  const progressOverallText = document.getElementById('progress-overall-text');
  const progressPctText = document.getElementById('progress-pct-text');
  const progressBar = document.getElementById('progress-bar');
  const progressElapsed = document.getElementById('progress-elapsed');
  const progressEtaText = document.getElementById('progress-eta-text');

  const srtOutput = document.getElementById('srt-output');
  const btnDownload = document.getElementById('btn-download');
  const resultBadge = document.getElementById('result-badge');
  const resultDuration = document.getElementById('result-duration');
  const intermediateSection = document.getElementById('intermediate-section');
  const intermediateButtons = document.getElementById('intermediate-buttons');

  const errorTitle = document.getElementById('error-title');
  const errorMsg = document.getElementById('error-msg');

  let selectedFile = null;
  let pollTimer = null;
  let jobStartTime = null;

  // --- File selection ---
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      selectFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      selectFile(fileInput.files[0]);
    }
  });

  function selectFile(file) {
    selectedFile = file;
    dropZone.classList.add('has-file');
    const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
    dropZone.innerHTML = `
      <p class="file-name">${escapeHtml(file.name)}</p>
      <p class="file-size">${sizeMB} MB</p>
      <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.flac,.ogg,.mp4,.mov,.webm,.mkv,.avi">
    `;
    // Re-bind hidden input
    const newInput = dropZone.querySelector('input');
    newInput.addEventListener('change', () => {
      if (newInput.files.length > 0) selectFile(newInput.files[0]);
    });
    btnSubmit.disabled = false;
  }

  // --- Submit ---
  btnSubmit.addEventListener('click', async () => {
    if (!selectedFile) return;

    // Build FormData
    const fd = new FormData();
    fd.append('file', selectedFile);
    if (contextInput.value.trim()) {
      fd.append('context', contextInput.value.trim());
    }
    fd.append('include_speaker', 'true');
    fd.append('use_alignment', optAlignment.checked ? 'true' : 'false');
    fd.append('use_llm_refinement', optRefinement.checked ? 'true' : 'false');
    fd.append('output_format', 'srt');
    fd.append('include_intermediate', 'true');

    // UI: show progress
    showView('progress');
    btnSubmit.disabled = true;
    progressOverallText.textContent = '업로드 중...';
    progressPctText.textContent = '';
    progressBar.style.width = '0%';
    progressElapsed.textContent = '';
    progressEtaText.textContent = '';
    document.getElementById('pipeline-stepper').innerHTML = '';
    jobStartTime = Date.now();
    stopIdlePolling();

    try {
      const res = await fetch('/transcribe/async', { method: 'POST', body: fd });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || errData.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const jobId = data.job_id;

      // Show initial ETA
      if (data.estimated_processing_seconds) {
        progressEtaText.textContent = `예상: ${formatDuration(data.estimated_processing_seconds)}`;
      }

      // Start polling
      startPolling(jobId);
      startElapsedTimer(null);
    } catch (err) {
      showError('요청 실패', err.message);
      btnSubmit.disabled = false;
      startIdlePolling();
    }
  });

  // --- Polling ---
  function startPolling(jobId) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => pollJob(jobId), 1500);
    // Immediate first poll
    pollJob(jobId);
  }

  async function pollJob(jobId) {
    try {
      const res = await fetch(`/jobs/${jobId}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const job = await res.json();
      updateProgress(job);
    } catch (err) {
      // Network error -- keep polling, don't stop
      console.error('Poll error:', err);
    }
  }

  function updateProgress(job) {
    window._currentJobData = job;

    if (job.status === 'queued') {
      progressOverallText.textContent = '대기 중';
      progressPctText.textContent = '';
      progressBar.style.width = '0%';
      progressElapsed.textContent = '';

      let etaText = '';
      if (job.queue_position != null && job.queue_position > 0) {
        etaText = '큐 위치: #' + job.queue_position;
      }
      if (job.estimated_wait_seconds > 0) {
        etaText += (etaText ? ' / ' : '') + '예상 대기: ' + formatDuration(job.estimated_wait_seconds);
      }
      progressEtaText.textContent = etaText;

      // Show empty stepper (all pending)
      renderStepper(job);
      return;
    }

    if (job.status === 'processing') {
      const pct = Math.round(job.progress * 100);
      progressOverallText.textContent = '처리 중';
      progressPctText.textContent = pct + '%';
      progressBar.style.width = pct + '%';

      // Elapsed time
      if (job.started_at && !monitoredJobStartTime) {
        startElapsedTimer(job.started_at);
      }

      // ETA
      if (job.estimated_completion) {
        const remaining = (new Date(job.estimated_completion) - Date.now()) / 1000;
        if (remaining > 0) {
          progressEtaText.textContent = '남은: ' + formatDuration(remaining);
        } else {
          progressEtaText.textContent = '거의 완료...';
        }
      } else if (job.estimated_processing_seconds) {
        progressEtaText.textContent = '남은: ' + formatDuration(job.estimated_processing_seconds);
      } else {
        progressEtaText.textContent = '';
      }

      // Render pipeline stepper
      renderStepper(job);
      return;
    }

    // Terminal states -- stop polling
    stopPolling();
    stopElapsedTimer();

    if (job.status === 'completed') {
      showResult(job);
      loadHistory();
      startIdlePolling();
      return;
    }

    if (job.status === 'failed') {
      const code = job.error_details?.error_code || '';
      const title = code ? '오류 [' + code + ']' : '오류';
      showError(title, job.error || '알 수 없는 오류');
      btnSubmit.disabled = false;
      loadHistory();
      startIdlePolling();
      return;
    }
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  // --- Pipeline Stepper ---
  function renderStepper(job) {
    const stepper = document.getElementById('pipeline-stepper');
    const currentStage = job.current_stage;

    // Parse stage timestamps from progress_history
    const stageStart = {};
    const stageEnd = {};
    const stageProgress = {};

    for (const entry of (job.progress_history || [])) {
      const s = entry.stage;
      const t = entry.timestamp;
      const p = entry.progress;
      if (!s || !t) continue;
      if (!(s in stageStart)) stageStart[s] = t;
      stageEnd[s] = t;
      stageProgress[s] = p;
    }

    let html = '';

    for (const stage of PIPELINE_STAGES) {
      const isDone = stageProgress[stage.key] >= 1.0;
      const isActive = stage.key === currentStage && !isDone;

      let stateClass = 'pending';
      let iconHtml = '<span style="font-size:0.7rem">&#9675;</span>';

      if (isDone) {
        stateClass = 'done';
        iconHtml = '&#10003;';
      } else if (isActive) {
        stateClass = 'active';
        iconHtml = '<span style="font-size:0.7rem">&#9679;</span>';
      }

      // Time info
      let detail = '';
      if (isDone && stageStart[stage.key] && stageEnd[stage.key]) {
        const startTs = new Date(stageStart[stage.key]).getTime();
        const endTs = new Date(stageEnd[stage.key]).getTime();
        const elapsed = Math.round((endTs - startTs) / 1000);
        if (elapsed > 0) {
          detail = formatDuration(elapsed);
        }
      } else if (isActive && stageStart[stage.key]) {
        const startTs = new Date(stageStart[stage.key]).getTime();
        const elapsed = Math.round((Date.now() - startTs) / 1000);
        detail = formatDuration(elapsed) + ' 경과';
      }

      // Chunk info for transcribing
      let chunkHtml = '';
      if (stage.key === 'transcribing' && job.total_chunks > 0) {
        chunkHtml = '<div class="step-detail">' + job.chunks_completed + '/' + job.total_chunks + ' 청크</div>';
      }

      // Mini progress bar for active stage
      let miniBar = '';
      if (isActive && stageProgress[stage.key] != null) {
        const pctVal = Math.round(stageProgress[stage.key] * 100);
        miniBar = '<div class="step-mini-bar"><div class="step-mini-fill" style="width:' + pctVal + '%"></div></div>';
      }

      // Intermediate result button
      let intermediateBtn = '';
      if (isDone) {
        if (stage.key === 'transcribing' && job.raw_srt) {
          intermediateBtn = '<button class="step-intermediate-btn" onclick="showSrtModal(\'Raw ASR 결과\', window._currentJobData.raw_srt)">결과 보기</button>';
        } else if (stage.key === 'aligning' && job.aligned_srt) {
          intermediateBtn = '<button class="step-intermediate-btn" onclick="showSrtModal(\'정렬 결과\', window._currentJobData.aligned_srt)">결과 보기</button>';
        } else if (stage.key === 'refining' && job.refined_srt) {
          intermediateBtn = '<button class="step-intermediate-btn" onclick="showSrtModal(\'교정 결과\', window._currentJobData.refined_srt)">결과 보기</button>';
        }
      }

      html += '<div class="step ' + stateClass + '">' +
        '<div class="step-icon">' + iconHtml + '</div>' +
        '<div class="step-content">' +
          '<div class="step-name">' + stage.name + '</div>' +
          (detail ? '<div class="step-detail">' + detail + '</div>' : '') +
          chunkHtml +
          miniBar +
          intermediateBtn +
        '</div>' +
      '</div>';
    }

    stepper.innerHTML = html;
  }

  // --- Elapsed Timer ---
  let elapsedTimer = null;
  let monitoredJobStartTime = null;

  function startElapsedTimer(startedAt) {
    monitoredJobStartTime = startedAt ? new Date(startedAt).getTime() : Date.now();
    if (elapsedTimer) clearInterval(elapsedTimer);
    elapsedTimer = setInterval(function() {
      const elapsed = Math.round((Date.now() - monitoredJobStartTime) / 1000);
      const el = document.getElementById('progress-elapsed');
      if (el) el.textContent = '경과: ' + formatDuration(elapsed);
    }, 1000);
  }

  function stopElapsedTimer() {
    if (elapsedTimer) {
      clearInterval(elapsedTimer);
      elapsedTimer = null;
    }
    monitoredJobStartTime = null;
  }

  // --- SRT Modal ---
  function showSrtModal(title, content) {
    document.getElementById('srt-modal-title').textContent = title;
    document.getElementById('srt-modal-content').value = content || '';
    document.getElementById('srt-modal').classList.add('show');
  }

  function closeSrtModal() {
    document.getElementById('srt-modal').classList.remove('show');
  }

  // Close on overlay click
  document.getElementById('srt-modal').addEventListener('click', function(e) {
    if (e.target === this) closeSrtModal();
  });

  // Expose to window for onclick handlers
  window.showSrtModal = showSrtModal;
  window.closeSrtModal = closeSrtModal;

  // --- Active Job Detection ---
  let idlePollTimer = null;

  async function checkActiveJobs() {
    try {
      const res = await fetch('/jobs/active');
      if (!res.ok) return;
      const data = await res.json();
      if (data.jobs && data.jobs.length > 0) {
        // Found active job -- start monitoring
        const activeJob = data.jobs.find(function(j) { return j.status === 'processing'; }) || data.jobs[0];
        showView('progress');
        jobStartTime = activeJob.started_at ? new Date(activeJob.started_at).getTime() : Date.now();
        startPolling(activeJob.job_id);
        startElapsedTimer(activeJob.started_at);
        stopIdlePolling();
      }
    } catch (err) {
      console.error('Active job check error:', err);
    }
  }

  function startIdlePolling() {
    if (idlePollTimer) return;
    idlePollTimer = setInterval(checkActiveJobs, 5000);
  }

  function stopIdlePolling() {
    if (idlePollTimer) {
      clearInterval(idlePollTimer);
      idlePollTimer = null;
    }
  }

  // --- Show result ---
  function showResult(job) {
    showView('result');
    btnSubmit.disabled = false;

    srtOutput.value = job.result || '';

    // Badge
    if (job.refined === true) {
      resultBadge.innerHTML = '<span class="result-badge badge-refined">LLM 교정됨</span>';
    } else if (job.refined === false) {
      resultBadge.innerHTML = '<span class="result-badge badge-unrefined">교정 안됨</span>';
    } else {
      resultBadge.innerHTML = '';
    }

    // Duration
    if (jobStartTime) {
      const elapsed = ((Date.now() - jobStartTime) / 1000);
      resultDuration.textContent = `소요 시간: ${formatDuration(elapsed)}`;
    } else if (job.audio_duration) {
      resultDuration.textContent = `오디오 길이: ${formatDuration(job.audio_duration)}`;
    } else {
      resultDuration.textContent = '';
    }

    // Download
    btnDownload.onclick = () => downloadSrt(job.result || '', 'output.srt');

    // Intermediate results
    const hasIntermediate = job.raw_srt || job.aligned_srt || job.refined_srt;
    if (hasIntermediate) {
      intermediateSection.style.display = '';
      intermediateButtons.innerHTML = '';

      if (job.raw_srt) {
        intermediateButtons.appendChild(makeDownloadBtn('Raw (VibeVoice)', job.raw_srt, 'raw.srt'));
      }
      if (job.aligned_srt) {
        intermediateButtons.appendChild(makeDownloadBtn('Aligned (Qwen)', job.aligned_srt, 'aligned.srt'));
      }
      if (job.refined_srt) {
        intermediateButtons.appendChild(makeDownloadBtn('Refined (LLM)', job.refined_srt, 'refined.srt'));
      }
    } else {
      intermediateSection.style.display = 'none';
    }
  }

  // --- Helpers ---
  function showView(name) {
    viewIdle.style.display = name === 'idle' ? '' : 'none';
    viewProgress.style.display = name === 'progress' ? '' : 'none';
    viewResult.style.display = name === 'result' ? '' : 'none';
    viewError.style.display = name === 'error' ? '' : 'none';
  }

  function showError(title, msg) {
    showView('error');
    errorTitle.textContent = title;
    errorMsg.textContent = msg;
  }

  function formatDuration(secs) {
    secs = Math.round(secs);
    if (secs < 60) return `${secs}초`;
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    if (m < 60) return s > 0 ? `${m}분 ${s}초` : `${m}분`;
    const h = Math.floor(m / 60);
    const rm = m % 60;
    return `${h}시간 ${rm}분`;
  }

  function downloadSrt(content, filename) {
    const blob = new Blob([content], { type: 'text/plain; charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function makeDownloadBtn(label, content, filename) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', () => downloadSrt(content, filename));
    return btn;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==========================================================================
  // Job History
  // ==========================================================================
  const historyBody = document.getElementById('history-body');
  const historyCount = document.getElementById('history-count');
  const historyEmpty = document.getElementById('history-empty');
  const historyPager = document.getElementById('history-pager');
  const historyPrev = document.getElementById('history-prev');
  const historyNext = document.getElementById('history-next');

  const PAGE_SIZE = 20;
  let historyOffset = 0;
  let historyTotal = 0;

  async function loadHistory() {
    try {
      const res = await fetch(`/jobs?limit=${PAGE_SIZE}&offset=${historyOffset}`);
      if (!res.ok) return;
      const data = await res.json();
      historyTotal = data.total;
      renderHistory(data.jobs);
    } catch (err) {
      console.error('History load error:', err);
    }
  }

  function renderHistory(jobs) {
    historyCount.textContent = `${historyTotal}건`;

    if (jobs.length === 0 && historyOffset === 0) {
      historyBody.innerHTML = '';
      historyEmpty.style.display = '';
      historyPager.style.display = 'none';
      return;
    }

    historyEmpty.style.display = 'none';
    historyBody.innerHTML = '';

    for (const job of jobs) {
      const tr = document.createElement('tr');
      tr.dataset.jobId = job.job_id;

      // Status
      const statusDot = `<span class="status-dot ${job.status}"></span>${job.status === 'completed' ? '완료' : '실패'}`;

      // Date
      const dt = job.created_at ? new Date(job.created_at + 'Z') : null;
      const dateStr = dt ? dt.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';

      // Duration
      let durStr = '-';
      if (job.audio_duration) {
        durStr = formatDuration(job.audio_duration);
      }

      // Refined badge
      let refinedHtml = '-';
      if (job.refined === true) {
        refinedHtml = '<span class="badge-sm refined">O</span>';
      } else if (job.refined === false) {
        refinedHtml = '<span class="badge-sm unrefined">X</span>';
      }

      // Files available
      let filesHtml = job.has_result_files ? 'O' : '<span class="badge-sm no-files">-</span>';

      tr.innerHTML = `<td>${statusDot}</td><td>${dateStr}</td><td>${durStr}</td><td>${refinedHtml}</td><td>${filesHtml}</td>`;

      tr.addEventListener('click', () => viewHistoryJob(job.job_id));
      historyBody.appendChild(tr);
    }

    // Pager
    if (historyTotal > PAGE_SIZE) {
      historyPager.style.display = '';
      historyPrev.disabled = historyOffset === 0;
      historyNext.disabled = historyOffset + PAGE_SIZE >= historyTotal;
    } else {
      historyPager.style.display = 'none';
    }
  }

  async function viewHistoryJob(jobId) {
    try {
      const res = await fetch(`/jobs/${jobId}`);
      if (!res.ok) return;
      const job = await res.json();

      // Highlight selected row
      historyBody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
      const row = historyBody.querySelector(`tr[data-job-id="${jobId}"]`);
      if (row) row.classList.add('selected');

      if (job.status === 'completed' && job.result) {
        jobStartTime = null;
        showResult(job);
      } else if (job.status === 'completed') {
        showView('result');
        srtOutput.value = '(결과 파일이 삭제되었습니다)';
        resultBadge.innerHTML = '';
        resultDuration.textContent = '';
        intermediateSection.style.display = 'none';
        btnDownload.onclick = null;
      } else if (job.status === 'failed') {
        showError('오류', job.error || '알 수 없는 오류');
      }
    } catch (err) {
      console.error('View job error:', err);
    }
  }

  historyPrev.addEventListener('click', () => {
    historyOffset = Math.max(0, historyOffset - PAGE_SIZE);
    loadHistory();
  });

  historyNext.addEventListener('click', () => {
    historyOffset += PAGE_SIZE;
    loadHistory();
  });

  // Load history on page load
  loadHistory();

  // Check for active jobs on page load
  checkActiveJobs();
  startIdlePolling();
})();
</script>
</body>
</html>
